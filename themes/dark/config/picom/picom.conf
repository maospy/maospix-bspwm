# MAOSPIX BSPWM - DARK
# Compositor Picom

backend = "xrender";
vsync = true;

# Sombras
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -5;
shadow-offset-y = -5;

# Esquinas redondeadas
corner-radius = 9;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Transiciones suaves
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# Transparencias
active-opacity = 1.0;
inactive-opacity = 0.96;
frame-opacity = 1.0;

# Excepciones
shadow-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'"
];
