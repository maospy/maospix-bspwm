[colors]
background = #121025
background-alt = #292044
foreground = #EAE6FF
primary = #B388FF
secondary = #42D9FF
alert = #FF4F91
disabled = #79718F

[bar/maospix]
width = 100%
height = 36
radius = 9
bottom = false
fixed-center = true

background = #121025
foreground = #EAE6FF

border-size = 0
padding-left = 2
padding-right = 2
module-margin = 0

font-0 = JetBrains Mono:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=11;2
font-2 = Font Awesome 6 Brands:style=Regular:size=15;2
font-3 = Maospix Icon:style=Regular:size=16;2
#font-2 = Font Awesome 6 Brands:style=Regular:size=11;2
modules-left = launcher wallpaper tema bspwm
modules-center = xwindow
#modules-right = cpu memory pulseaudio date power
modules-right = cafeina cpu memory pulseaudio bluetooth tray date power
cursor-click = pointer
enable-ipc = true
wm-restack = bspwm


[module/launcher]
type = custom/text
format = ""
format-font = 4
format-foreground = ${colors.primary}
format-padding = 1
click-left = rofi -show drun -show-icons -theme $HOME/.config/rofi/themes/maospix-dark.rasi

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true

ws-icon-0 = I;01
ws-icon-1 = II;02
ws-icon-2 = III;03
ws-icon-3 = IV;04
ws-icon-4 = V;05
ws-icon-5 = VI;06
ws-icon-6 = VII;07
ws-icon-7 = VIII;08
ws-icon-8 = IX;09
ws-icon-9 = X;10
ws-icon-default = ?

label-focused = %icon%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-empty = 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 0

label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:25:...%
label-foreground = ${colors.secondary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}
format-muted = <label-muted>
label-muted = "MUTE"
label-muted-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1
date = %d/%m/%Y
time = %H:%M
format-prefix = " "
format-prefix-foreground = ${colors.primary}
#label = %date%  %time%
label = %date%  %time%


; MAOSPIX - Boton de energia

[module/power]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.alert}
format-padding = 2
click-left = $HOME/.local/bin/maospix-power-open.sh

; MAOSPIX - Selector de wallpapers

[module/wallpaper]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.secondary}
format-padding = 2
click-left = $HOME/.local/bin/maospix-wallpapers.sh

; MAOSPIX - Bluetooth

[module/bluetooth]
type = custom/script
exec = $HOME/.local/bin/maospix-bluetooth.sh
interval = 3

format-prefix = " "
format-prefix-font = 3
format-prefix-foreground = ${colors.secondary}

label = %output%

click-left = $HOME/.local/bin/maospix-bluetooth.sh toggle
click-right = blueman-manager
; MAOSPIX - Bandeja de red y sistema

[module/tray]
type = internal/tray
tray-size = 65%
tray-spacing = 4px
tray-padding = 2px
tray-background = ${colors.background}
format-margin = 4px
[settings]
screenchange-reload = true
; MAOSPIX - Modo Cafeína

[module/cafeina]
type = custom/script
exec = $HOME/.local/bin/maospix-cafe.sh | sed -e 's/Cafeína DESACTIVADA/OFF/' -e 's/Cafeína ACTIVADA/ON/'
#exec = $HOME/.local/bin/maospix-cafe.sh
interval = 2

format-foreground = ${colors.primary}
format-padding = 1
label = %output%

click-left = $HOME/.local/bin/maospix-cafe.sh toggle

; MAOSPIX - Selector de temas
[module/tema]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.primary}
format-padding = 2
click-left = $HOME/.local/bin/maospix-theme.sh
